name: Bug report
description: Report a problem with Argus.
title: "[Bug]\x20"
labels:
  - bug
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local
        - staging
        - production
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web app
        - website
        - mobile app
        - backend/API
    validations:
      required: true
  - type: input
    id: browser_or_device
    attributes:
      label: Browser or device
      description: Include the browser and version, or device and operating system.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if they help explain the problem.
    validations:
      required: false
