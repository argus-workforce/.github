name: Feature request
description: Suggest an improvement to Argus.
title: "[Feature]\x20"
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do we solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change you propose.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that make this change complete.
      placeholder: |
        - [ ] First criterion
        - [ ] Second criterion
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web app
        - website
        - mobile app
        - backend/API
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - matching
        - schedule
        - hours
        - auth
        - tenant
        - ui
        - api
        - mobile
    validations:
      required: true
