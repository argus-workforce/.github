name: CI (Node)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    uses: argus-workforce/workflows/.github/workflows/node-quality.yml@v1
    secrets: inherit
  e2e:
    needs: quality
    uses: argus-workforce/workflows/.github/workflows/e2e-playwright.yml@v1
    secrets: inherit
